<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Turbo Trail</title><style>@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Mono&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4d467;color:#12303b;font-family:'Barlow Condensed',sans-serif}.app{width:min(1200px,100%);padding:18px}.top{height:68px;padding:0 20px;display:flex;align-items:center;gap:25px;background:#fff6dc;border:4px solid #12303b;border-bottom:0}.logo{margin-right:auto;font-size:36px;font-weight:900;font-style:italic}.logo b{color:#f65c3a}.s{border-left:2px solid #d8c99c;padding-left:15px}.s small{display:block;font:10px 'DM Mono'}.s strong{font-size:25px}.stage{position:relative;border:4px solid #12303b;overflow:hidden}canvas{width:100%;display:block;aspect-ratio:16/9}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff6dce8;transition:.2s}.hide{opacity:0;pointer-events:none}.tag{padding:5px 9px;margin:0;background:#dafa62;border:2px solid #12303b;font:11px 'DM Mono'}.title{margin:12px 0;font-size:clamp(70px,13vw,140px);line-height:.7;letter-spacing:-6px;font-weight:900;font-style:italic;transform:skew(-7deg);text-shadow:5px 5px #f65c3a}.title i{color:#f65c3a;font-style:normal;text-shadow:5px 5px #12303b}.copy{max-width:410px;font:13px/1.6 'DM Mono'}.keys{position:absolute;bottom:18px;font:10px 'DM Mono'}button{border:3px solid #12303b;background:#dafa62;box-shadow:5px 5px #12303b;padding:10px 22px;font:900 italic 24px 'Barlow Condensed';cursor:pointer}.tip{text-align:center;font:11px 'DM Mono'}@media(max-width:600px){.app{padding:7px}.top{height:56px;padding:0 9px}.logo{font-size:27px}.s{padding-left:8px}.s strong{font-size:20px}.keys{display:none}}</style><body><main class=app><header class=top><div class=logo><b>TURBO</b> TRAIL</div><div class=s><small>COINS</small><strong id=coins>000</strong></div><div class=s><small>DISTANCE</small><strong id=dist>0000m</strong></div></header><section class=stage><canvas id=g width=1200 height=675></canvas><div class=screen id=intro><p class=tag>RACE - JUMP - TURBO</p><h1 class=title>TURBO<br><i>TRAIL</i></h1><p class=copy>A fast platform game starring a car. Collect coins and reach the finish flag!</p><button onclick=start()>START RACE</button><p class=keys>ARROWS / A D TO DRIVE - SPACE TO JUMP</p></div><div class="screen hide" id=win><p class=tag>STAGE COMPLETE</p><h2 class=title>TRACK<br><i>CLEAR!</i></h2><p class=copy id=result></p><button onclick=start()>RACE AGAIN</button></div></section><p class=tip>Build speed before jumping to reach high platforms.</p></main><script>const c=g.getContext('2d'),K={};let on=0,tm=0,cam=0,num=0;const car={x:90,y:480,w:68,h:34,vx:0,vy:0,ground:0,a:0},land=[[0,540,360],[340,500,310],[630,540,350],[960,455,310],[1250,540,370],[1600,495,320],[1900,540,370],[2250,450,600],[2800,540,700]].map(v=>({x:v[0],y:v[1],w:v[2],h:160})),plat=[[250,410,100],[530,390,120],[870,400,110],[1050,330,135],[1430,400,130],[1800,355,130],[2140,385,120],[2530,315,170]].map(v=>({x:v[0],y:v[1],w:v[2],h:20})),coins=[210,290,390,560,640,760,900,1080,1200,1370,1480,1580,1740,1860,2010,2170,2350,2480,2600].map((x,i)=>({x,y:i%3==0?390:i%4==0?330:465,t:0,i})),goal={x:3260,y:360};onkeydown=e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!on&&(e.code=='Enter'||e.code=='Space'))start()};onkeyup=e=>K[e.code]=0;function start(){Object.assign(car,{x:90,y:480,vx:0,vy:0,ground:0,a:0});coins.forEach(q=>q.t=0);cam=num=0;coinsEl.textContent='000';dist.textContent='0000m';intro.classList.add('hide');win.classList.add('hide');on=1;tm=performance.now();requestAnimationFrame(loop)}const coinsEl=document.querySelector('#coins'),dist=document.querySelector('#dist'),intro=document.querySelector('#intro'),win=document.querySelector('#win'),result=document.querySelector('#result');function step(d){let ac=car.ground?.001:.0004;if(K.ArrowRight||K.KeyD)car.vx+=ac*d;if(K.ArrowLeft||K.KeyA)car.vx-=ac*d;car.vx*=car.ground?.994:.998;car.vx=Math.max(-.5,Math.min(1.1,car.vx));if((K.Space||K.KeyW||K.ArrowUp)&&car.ground){car.vy=-.65;car.ground=0}car.vy+=.00165*d;car.x+=car.vx*d;car.y+=car.vy*d;car.ground=0;for(let q of [...land,...plat])if(car.vy>=0&&car.y+car.h>=q.y&&car.y+car.h-car.vy*d<=q.y+8&&car.x+car.w-8>q.x&&car.x+8<q.x+q.w){car.y=q.y-car.h;car.vy=0;car.ground=1}if(car.y>700)Object.assign(car,{x:Math.max(30,car.x-90),y:330,vx:0,vy:0});for(let q of coins)if(!q.t&&Math.hypot(car.x+34-q.x,car.y+17-q.y)<38){q.t=1;num++}car.a+=car.vx*d*.024;cam+=(car.x-220-cam)*Math.min(1,d*.004);cam=Math.max(0,Math.min(2200,cam));coinsEl.textContent=String(num).padStart(3,'0');dist.textContent=String(Math.floor(car.x/2.7)).padStart(4,'0')+'m';if(car.x>goal.x){on=0;result.textContent='You collected '+num+' of '+coins.length+' coins.';win.classList.remove('hide')}}function hill(y,col,r){c.beginPath();c.moveTo(0,675);for(let x=-60;x<1260;x+=60){let z=x+cam*r;c.lineTo(x,y+Math.sin(z*.008)*28)}c.lineTo(1200,675);c.fillStyle=col;c.fill()}function draw(){let bg=c.createLinearGradient(0,0,0,675);bg.addColorStop(0,'#71dceb');bg.addColorStop(1,'#d3f2cc');c.fillStyle=bg;c.fillRect(0,0,1200,675);c.fillStyle='#fff0a5';c.beginPath();c.arc(930,110,55,0,7);c.fill();hill(390,'#8bd99d',.15);hill(470,'#45b77d',.3);for(let x=-50;x<1250;x+=145){let z=x-(cam*.45%145);c.fillStyle='#287a60';c.fillRect(z,350,9,105);c.beginPath();c.arc(z+4,340,35,0,7);c.fill()}for(let q of [...land,...plat]){let x=q.x-cam;c.fillStyle='#315c47';c.fillRect(x,q.y,q.w,q.h);c.fillStyle='#9bd957';c.fillRect(x,q.y,q.w,13);c.lineWidth=4;c.strokeStyle='#12303b';c.strokeRect(x,q.y,q.w,q.h)}let fx=goal.x-cam;c.fillStyle='#ffe15c';c.fillRect(fx,goal.y,10,180);c.fillStyle='#f65c3a';c.fillRect(fx+10,goal.y,58,42);c.strokeStyle='#12303b';c.strokeRect(fx+10,goal.y,58,42);c.fillStyle='#12303b';c.font='900 16px Barlow Condensed';c.fillText('FINISH',fx+13,goal.y+27);for(let q of coins)if(!q.t){let y=q.y+Math.sin(performance.now()*.006+q.i)*5;c.beginPath();c.arc(q.x-cam,y,12,0,7);c.fillStyle='#ffdd48';c.fill();c.lineWidth=4;c.strokeStyle='#a65529';c.stroke()}c.save();c.translate(car.x-cam+34,car.y+17);c.rotate(car.a);c.fillStyle='#172d38';for(let w of[-22,23]){c.beginPath();c.arc(w,15,13,0,7);c.fill()}c.beginPath();c.moveTo(-36,13);c.lineTo(-27,-6);c.lineTo(-5,-16);c.lineTo(20,-16);c.lineTo(34,-4);c.lineTo(37,13);c.closePath();c.fillStyle='#f65c3a';c.fill();c.lineWidth=4;c.strokeStyle='#12303b';c.stroke();c.fillStyle='#8fe6e5';c.fillRect(-15,-11,37,8);c.restore()}function loop(t){if(!on)return;let d=Math.min(32,t-tm);tm=t;step(d);draw();requestAnimationFrame(loop)}draw();</script>
